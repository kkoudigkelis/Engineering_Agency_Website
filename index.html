<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datawise — Engineering for What Comes Next</title>
<meta name="description" content="Embedded engineering, powered by proprietary AI. Datawise has been engineering what comes next since 2006.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◆</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#060605;font-family:'DM Sans',sans-serif;color:#ede9e0}

/* Slide container */
.slides{position:relative;width:100%;height:100vh}
.slide{
  position:absolute;inset:0;
  opacity:0;pointer-events:none;
  transition:opacity .9s ease;
  z-index:0;
}
.slide.active{opacity:1;pointer-events:all;z-index:1}
.slide iframe{width:100%;height:100%;border:none;display:block;background:#060605}

/* Bottom navigation dots */
.dots{
  position:fixed;bottom:20px;left:50%;
  transform:translateX(-50%);
  z-index:9999;
  display:flex;gap:14px;
  padding:8px 16px;
  background:rgba(6,6,5,.6);
  border-radius:20px;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(201,169,110,.06);
  transition:opacity .5s,transform .5s;
}
.dots.hide{opacity:0;transform:translateX(-50%) translateY(20px);pointer-events:none}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:rgba(201,169,110,.12);
  border:none;padding:0;cursor:pointer;
  transition:all .4s ease;outline:none;
}
.dot.active{
  background:rgba(201,169,110,.6);
  box-shadow:0 0 12px rgba(201,169,110,.25);
}
.dot:hover{background:rgba(201,169,110,.35)}

/* Scroll hint */
.scroll-hint{
  position:fixed;bottom:0;left:50%;
  width:1px;height:48px;z-index:9998;
  background:linear-gradient(to bottom,transparent,rgba(201,169,110,.15));
  animation:pulse 2.5s ease infinite;
  transition:opacity .5s;
}
.scroll-hint.hide{opacity:0}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:.6}}
</style>
</head>
<body>

<div class="slides">
  <div class="slide active"><iframe src="slide1.html" title="Datawise — Hero"></iframe></div>
  <div class="slide"><iframe data-src="slide2.html" title="Datawise — The Landscape"></iframe></div>
  <div class="slide"><iframe data-src="slide3.html" title="Datawise — Delivery Framework"></iframe></div>
  <div class="slide"><iframe data-src="slide4.html" title="Datawise — The Engine"></iframe></div>
</div>

<div class="dots" id="dots"></div>
<div class="scroll-hint" id="sh"></div>

<script>
(function(){
  var slides = document.querySelectorAll('.slide');
  var dotsEl = document.getElementById('dots');
  var sh = document.getElementById('sh');
  var N = slides.length;
  var cur = 0, lock = false;

  // Build dots
  for(var i = 0; i < N; i++){
    var d = document.createElement('button');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.setAttribute('aria-label', 'Slide ' + (i + 1));
    (function(idx){ d.onclick = function(){ go(idx); }; })(i);
    dotsEl.appendChild(d);
  }
  var dots = dotsEl.querySelectorAll('.dot');
  var loaded = [true, false, false, false]; // slide 1 is already loaded

  function setupIframeListeners(ifr, i){
    try {
      ifr.contentWindow.addEventListener('wheel', function(e){
        if(i < N - 1){
          onWheel(e.deltaY);
        } else {
          var wrap = ifr.contentDocument.getElementById('sw') ||
                     ifr.contentDocument.querySelector('.wrap') ||
                     ifr.contentDocument.scrollingElement;
          if(wrap && wrap.scrollTop <= 5 && e.deltaY < 0){
            onWheel(e.deltaY);
          }
        }
      }, {passive: true});

      var ty = 0;
      ifr.contentWindow.addEventListener('touchstart', function(e){
        ty = e.touches[0].clientY;
      });
      ifr.contentWindow.addEventListener('touchend', function(e){
        var d = ty - e.changedTouches[0].clientY;
        if(i < N - 1 && Math.abs(d) > 50){
          if(d > 0) go(cur + 1); else go(cur - 1);
        } else if(i === N - 1 && d < -50){
          var wrap = ifr.contentDocument.getElementById('sw') ||
                     ifr.contentDocument.querySelector('.wrap') ||
                     ifr.contentDocument.scrollingElement;
          if(wrap && wrap.scrollTop <= 5) go(cur - 1);
        }
      });
    } catch(err){}
  }

  function loadSlide(idx, cb){
    var ifr = slides[idx].querySelector('iframe');
    var src = ifr.getAttribute('data-src');
    if(!src){ if(cb) cb(); return; } // already loaded via src
    ifr.onload = function(){
      ifr.onload = null;
      setupIframeListeners(ifr, idx);
      if(cb) cb();
    };
    ifr.src = src;
    ifr.removeAttribute('data-src');
    loaded[idx] = true;
  }

  function go(idx){
    if(idx === cur || lock || idx < 0 || idx >= N) return;
    lock = true;

    function doTransition(){
      slides[cur].classList.remove('active');
      dots[cur].classList.remove('active');
      cur = idx;
      slides[cur].classList.add('active');
      dots[cur].classList.add('active');

      // On last slide (artifact 4 has its own nav), hide main dots
      if(cur === N - 1){
        dotsEl.classList.add('hide');
        sh.classList.add('hide');
      } else {
        dotsEl.classList.remove('hide');
        sh.classList.remove('hide');
      }

      setTimeout(function(){ lock = false; }, 950);
    }

    if(!loaded[idx]){
      // Lazy-load the iframe, then transition once ready
      loadSlide(idx, doTransition);
    } else {
      doTransition();
    }
  }

  // Wheel navigation
  var wt = null;
  function onWheel(dy){
    if(wt) return;
    if(dy > 0) go(cur + 1);
    else if(dy < 0) go(cur - 1);
    wt = setTimeout(function(){ wt = null; }, 700);
  }

  // Main doc wheel (catches events in non-iframe areas)
  document.addEventListener('wheel', function(e){
    e.preventDefault();
    onWheel(e.deltaY);
  }, {passive: false});

  // Set up wheel/touch listeners for slide 1 (already loaded)
  var ifr0 = slides[0].querySelector('iframe');
  ifr0.addEventListener('load', function(){
    setupIframeListeners(ifr0, 0);
  });

  // Keyboard
  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowDown' || e.key === 'PageDown'){
      e.preventDefault(); go(cur + 1);
    } else if(e.key === 'ArrowUp' || e.key === 'PageUp'){
      e.preventDefault(); go(cur - 1);
    }
  });

  // Touch on main doc
  var touchY = 0;
  document.addEventListener('touchstart', function(e){ touchY = e.touches[0].clientY; });
  document.addEventListener('touchend', function(e){
    var d = touchY - e.changedTouches[0].clientY;
    if(Math.abs(d) > 50){ if(d > 0) go(cur + 1); else go(cur - 1); }
  });
})();
</script>
</body>
</html>
