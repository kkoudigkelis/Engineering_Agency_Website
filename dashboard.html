];

const ma50w = 98238;
const ma200w = 47500;
const sthCostBasis = 111000;

function computeScore(price, ma, spread, lossIntensity) {
  const ratio = price / ma;
  const s1 = Math.max(0, Math.min(100, (1.5 - ratio) / 1.0 * 100));
  const avgSpread = (spread.vsNasdaq + spread.vsSP + spread.vsGold) / 3;
  const s2 = Math.max(0, Math.min(100, (50 - avgSpread) / 150 * 100));
  const s3 = Math.max(0, Math.min(100, lossIntensity));
  const score = Math.round(0.40 * s1 + 0.35 * s2 + 0.25 * s3);
  return { score, s1: Math.round(s1), s2: Math.round(s2), s3: Math.round(s3) };
}

const liveSpread = (() => {
  const btcR = (PRICE - spreadBase.btc) / spreadBase.btc * 100;
  const spR = (6950 - spreadBase.sp) / spreadBase.sp * 100;
  const ndqR = (22900 - spreadBase.nasdaq) / spreadBase.nasdaq * 100;
  const goldR = (5210 - spreadBase.gold) / spreadBase.gold * 100;
  return {
    vsNasdaq: +(btcR - ndqR).toFixed(1),
    vsSP: +(btcR - spR).toFixed(1),
    vsGold: +(btcR - goldR).toFixed(1),
  };
})();

const lastLoss = realizedLosses[realizedLosses.length - 1].intensity;

const scoreColor = v.score >= 50 ? C.green : v.score >= 20 ? C.yellow : C.red;

const scoreHistory = priceHistory.map((ph, i) => {
  const sp = spreadData[i];
  const rl = realizedLosses[i];
  if (!sp || !rl) return { date: ph.date, score: 0, price: ph.price };
  const s = computeScore(ph.price, ph.ma50w, sp, rl.intensity);
  return { date: ph.date, score: s.score, price: ph.price };
});

function Tip({ active, payload, label }) {
  if (!active || !payload || !payload.length) return null;
  return (
    <div style={{ background: C.card, border: "1px solid " + C.border, borderRadius: 6, padding: "8px 12px", fontSize: 12, color: C.text }}>
      <div style={{ color: C.dim, marginBottom: 4 }}>{label}</div>
      {payload.map((p, i) => (
        <div key={i} style={{ color: p.color, fontFamily: "monospace" }}>
          {p.name}: {typeof p.value === "number" ? (p.value > 1000 ? "$" + (p.value/1000).toFixed(0) + "K" : p.value + "%") : p.value}
        </div>
      ))}
    </div>
  );
}

function ScoreColor({ val }) {
  const c = val >= 50 ? C.green : val >= 20 ? C.yellow : C.dim;
  return <span style={{ fontFamily: "monospace", fontWeight: 700, color: c }}>{val}</span>;
}

            <ComposedChart data={spreadData} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
              <CartesianGrid strokeDasharray="3 3" stroke={C.border} />
              <XAxis dataKey="date" tick={{ fill: C.muted, fontSize: 9 }} axisLine={{ stroke: C.border }} tickLine={false} interval={2} />
              <YAxis tick={{ fill: C.muted, fontSize: 10 }} axisLine={false} tickLine={false} tickFormatter={val => (val > 0 ? "+" : "") + val + "%"} />
              <Tooltip contentStyle={{ background: C.card, border: "1px solid " + C.border, borderRadius: 6 }} labelStyle={{ color: C.text }} formatter={val => [(val > 0 ? "+" : "") + val + "%", ""]} />
              <ReferenceLine y={0} stroke={C.muted} strokeDasharray="6 3" strokeWidth={1} />
              <Line type="monotone" dataKey="vsNasdaq" stroke={C.blue} strokeWidth={2} dot={false} name="vs Nasdaq" />
              <Line type="monotone" dataKey="vsSP" stroke={C.purple} strokeWidth={2} dot={false} name="vs S&P" />
              <Line type="monotone" dataKey="vsGold" stroke={C.yellow} strokeWidth={2} dot={false} name="vs Gold" />
            </ComposedChart>
          </ResponsiveContainer>
          <div style={{ display: "flex", justifyContent: "center", gap: 14, padding: "6px 0", fontSize: 10, flexWrap: "wrap" }}>
            <span><span style={{ color: C.blue }}>\u2501\u2501</span> <span style={{ color: C.dim }}>vs Nasdaq ({last.vsNasdaq > 0 ? "+" : ""}{last.vsNasdaq}%)</span></span>
            <span><span style={{ color: C.purple }}>\u2501\u2501</span> <span style={{ color: C.dim }}>vs S&P ({last.vsSP > 0 ? "+" : ""}{last.vsSP}%)</span></span>
            <span><span style={{ color: C.yellow }}>\u2501\u2501</span> <span style={{ color: C.dim }}>vs Gold ({last.vsGold > 0 ? "+" : ""}{last.vsGold}%)</span></span>
          </div>
        </div>
      </div>

      {/* CHART 3: Realized losses */}
      <div style={{ marginBottom: 28 }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: C.text, marginBottom: 4 }}>\u2462 Are holders selling at a loss?</div>
        <div style={{ fontSize: 11, color: C.dim, marginBottom: 12, lineHeight: 1.6 }}>
          When BTC holders move coins on-chain at prices below what they paid, that's a realized loss — they're capitulating.
          This index tracks the <em>volume</em> of those loss-taking transactions relative to the cycle peak, scaled 0-100.{" "}
          <span style={{ color: C.green }}>Higher = more pain = better time to buy. Yellow dashed line is the 6-month rolling average — when red spikes above it, capitulation is elevated vs recent norm.</span>
        </div>
        <div style={{ fontSize: 10, marginBottom: 14, lineHeight: 1.5, padding: "10px 12px", background: "rgba(255,255,255,0.03)", borderRadius: 6, border: "1px solid " + C.border }}>
          <div style={{ color: C.text, fontWeight: 600, marginBottom: 8, fontSize: 11 }}>Reading the gap between red and yellow:</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            <div style={{ display: "flex", gap: 8 }}>
              <span style={{ color: C.red, minWidth: 120, fontWeight: 600 }}>Red spikes above</span>
              <span style={{ color: C.dim }}>Acute panic. Sudden wave of loss-taking — fresh shock, holders rushing for exits.</span>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <span style={{ color: C.yellow, minWidth: 120, fontWeight: 600 }}>Gap closing high</span>
              <span style={{ color: C.dim }}>Sustained bleed. Pain became the new normal. Weak hands grinding out month after month. \u2190 we're here</span>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <span style={{ color: C.muted, minWidth: 120, fontWeight: 600 }}>Both low & flat</span>
              <span style={{ color: C.dim }}>Complacency. Nobody's in pain — market is vulnerable. (Oct 25: both ~3, then Nov exploded to 45.)</span>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <span style={{ color: C.green, minWidth: 120, fontWeight: 600 }}>Both declining</span>
              <span style={{ color: C.dim }}>Exhaustion. Selling is drying up from high levels — where bottoms tend to form.</span>
            </div>
          </div>
        </div>
        <div style={{ background: C.card, borderRadius: 8, padding: "12px 8px 4px", border: "1px solid " + C.border }}>
          <ResponsiveContainer width="100%" height={280}>
            <ComposedChart data={capWithAvg} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
              <defs>
                <linearGradient id="lossGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="5%" stopColor={C.red} stopOpacity={0.35} />
                  <stop offset="95%" stopColor={C.red} stopOpacity={0.02} />
                </linearGradient>
              </defs>
              <CartesianGrid strokeDasharray="3 3" stroke={C.border} />
              <XAxis dataKey="date" tick={{ fill: C.muted, fontSize: 9 }} axisLine={{ stroke: C.border }} tickLine={false} interval={2} />
              <YAxis domain={[0, 100]} tick={{ fill: C.muted, fontSize: 10 }} axisLine={false} tickLine={false} ticks={[0, 25, 50, 75, 100]} />
              <Tooltip contentStyle={{ background: C.card, border: "1px solid " + C.border, borderRadius: 6 }} labelStyle={{ color: C.text }} formatter={(val, name) => [val + "/100", name === "avg" ? "6-mo avg" : "Loss intensity"]} />
              <Area type="monotone" dataKey="intensity" stroke={C.red} strokeWidth={2.5} fill="url(#lossGrad)" dot={false} name="intensity" />
              <Line type="monotone" dataKey="avg" stroke={C.yellow} strokeWidth={1.5} strokeDasharray="6 3" dot={false} name="avg" />
            </ComposedChart>
          </ResponsiveContainer>
          <div style={{ display: "flex", justifyContent: "center", gap: 20, padding: "6px 0", fontSize: 10 }}>
            <span><span style={{ color: C.red }}>\u2501\u2501</span> <span style={{ color: C.dim }}>Loss intensity ({lastP.intensity}/100)</span></span>
            <span><span style={{ color: C.yellow }}>\u254C\u254C</span> <span style={{ color: C.dim }}>6-mo rolling avg ({capWithAvg[capWithAvg.length - 1].avg})</span></span>
          </div>
        </div>
      </div>

      {/* CHART 4: Leverage */}
      <div style={{ marginBottom: 28 }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: C.text, marginBottom: 4 }}>
          \u2463 How is the market positioned? <span style={{ fontSize: 10, color: C.muted, fontWeight: 400 }}>(context only — not scored)</span>
        </div>
        <div style={{ fontSize: 11, color: C.dim, marginBottom: 12, lineHeight: 1.6 }}>
          Open interest in BTC futures — how much money is betting long vs short.{" "}
          <span style={{ color: C.red }}>Red (longs) = traders betting on up.</span>{" "}
          <span style={{ color: C.green }}>Green (shorts) = traders betting on down. When green exceeds red, the market is positioned for a drop — and that's contrarian-bullish.</span>
        </div>
        <div style={{ background: C.card, borderRadius: 8, padding: "12px 8px 4px", border: "1px solid " + C.border }}>
          <ResponsiveContainer width="100%" height={280}>
            <ComposedChart data={leverageData} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
              <CartesianGrid strokeDasharray="3 3" stroke={C.border} />
              <XAxis dataKey="date" tick={{ fill: C.muted, fontSize: 9 }} axisLine={{ stroke: C.border }} tickLine={false} interval={2} />
              <YAxis tick={{ fill: C.muted, fontSize: 10 }} axisLine={false} tickLine={false} tickFormatter={val => "$" + val + "B"} />
              <Tooltip contentStyle={{ background: C.card, border: "1px solid " + C.border, borderRadius: 6, color: C.text }} labelStyle={{ color: C.text }} formatter={(val, name) => ["$" + val + "B", name]} />
              <Line type="monotone" dataKey="longOI" stroke={C.red} strokeWidth={2.5} dot={false} name="Longs" />
              <Line type="monotone" dataKey="shortOI" stroke={C.green} strokeWidth={2.5} dot={false} name="Shorts" />
            </ComposedChart>
          </ResponsiveContainer>
          <div style={{ display: "flex", justifyContent: "center", gap: 14, padding: "6px 0", fontSize: 10 }}>
            <span><span style={{ color: C.red }}>\u2501\u2501</span> <span style={{ color: C.dim }}>Longs (${lastLev.longOI}B)</span></span>
            <span><span style={{ color: C.green }}>\u2501\u2501</span> <span style={{ color: C.dim }}>Shorts (${lastLev.shortOI}B)</span></span>
          </div>
        </div>
        <div style={{ marginTop: 10, display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
          <div style={{ background: C.greenBg, borderRadius: 6, padding: "10px 12px", border: "1px solid " + C.green + "33" }}>
            <div style={{ fontSize: 10, color: C.muted, marginBottom: 4 }}>Crossover</div>
            <div style={{ fontSize: 18, fontFamily: "monospace", fontWeight: 700, color: C.green }}>\u2713 YES</div>
            <div style={{ fontSize: 10, color: C.green, marginBottom: 6 }}>Shorts exceeded longs Dec 25</div>
            <div style={{ fontSize: 9, color: C.dim, lineHeight: 1.5 }}>More traders betting on a drop than a rise. Contrarian-bullish: when everyone's positioned short, any up-move forces them to buy back, accelerating the rally.</div>
          </div>
          <div style={{ background: C.greenBg, borderRadius: 6, padding: "10px 12px", border: "1px solid " + C.green + "33" }}>
            <div style={{ fontSize: 10, color: C.muted, marginBottom: 4 }}>Gap</div>
            <div style={{ fontSize: 18, fontFamily: "monospace", fontWeight: 700, color: C.green }}>+${gap}B</div>
            <div style={{ fontSize: 10, color: C.green, marginBottom: 6 }}>Squeeze fuel building</div>
            <div style={{ fontSize: 9, color: C.dim, lineHeight: 1.5 }}>${gap}B more in short positions than longs. If price pops, all of that needs to cover — creating forced buying pressure that feeds on itself.</div>
          </div>
          <div style={{ background: C.greenBg, borderRadius: 6, padding: "10px 12px", border: "1px solid " + C.green + "33" }}>
            <div style={{ fontSize: 10, color: C.muted, marginBottom: 4 }}>Fear & Greed</div>
            <div style={{ fontSize: 18, fontFamily: "monospace", fontWeight: 700, color: C.green }}>5</div>
            <div style={{ fontSize: 10, color: C.green, marginBottom: 6 }}>Historic low</div>
            <div style={{ fontSize: 9, color: C.dim, lineHeight: 1.5 }}>Crypto sentiment index (0-100). A 5 means almost nobody wants to touch BTC. Extreme fear historically marks better entries than extreme greed.</div>
          </div>
        </div>
      </div>

      {/* BOTTOM LINE */}
      <div style={{ background: C.card, border: "1px solid " + scoreColor + "33", borderRadius: 8, padding: "16px 18px", marginBottom: 20 }}>
        <div style={{ fontSize: 11, color: C.muted, fontWeight: 700, letterSpacing: 1.2, textTransform: "uppercase", marginBottom: 10 }}>
          How to use your score
        </div>
        <div style={{ fontSize: 14, color: C.text, lineHeight: 1.7, marginBottom: 12 }}>
          Your score is <strong style={{ color: scoreColor, fontSize: 20, fontFamily: "monospace" }}>{v.score}</strong>.{" "}
          The score is your allocation dial — treat it as a percentage of your maximum monthly DCA.
          If your max comfortable buy is $3,000/month, today says deploy{" "}
          <strong style={{ color: scoreColor }}>${Math.round(3000 * v.score / 100).toLocaleString()}</strong>.
        </div>
        <div style={{ padding: "12px 14px", background: C.bg, borderRadius: 6, border: "1px solid " + C.border, marginBottom: 12 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: C.text, marginBottom: 8 }}>Score = weighted average of three signals</div>
          <div style={{ display: "grid", gridTemplateColumns: "auto auto 1fr auto", gap: "6px 10px", fontSize: 12, alignItems: "center" }}>
            <span style={{ color: C.dim }}>40%</span><span style={{ color: C.text }}>\u00d7</span>
            <span style={{ color: C.text }}>\u2460 Trend position</span>
            <ScoreColor val={v.s1} />
            <span style={{ color: C.dim }}>35%</span><span style={{ color: C.text }}>\u00d7</span>
            <span style={{ color: C.text }}>\u2461 Relative performance</span>
            <ScoreColor val={v.s2} />
            <span style={{ color: C.dim }}>25%</span><span style={{ color: C.text }}>\u00d7</span>
            <span style={{ color: C.text }}>\u2462 Capitulation intensity</span>
            <ScoreColor val={v.s3} />
            <span style={{ color: C.dim, gridColumn: "1 / 4", borderTop: "1px solid " + C.border, paddingTop: 6 }}>=</span>
            <span style={{ fontFamily: "monospace", fontWeight: 700, fontSize: 16, color: scoreColor, borderTop: "1px solid " + C.border, paddingTop: 6 }}>{v.score}</span>
          </div>
        </div>
        <div style={{ fontSize: 11, color: C.dim, lineHeight: 1.6 }}>
          <strong style={{ color: C.text }}>Data: verified monthly averages</strong> (StatMuse, officialdata.org). Weights based on backtest strength: \u2460 +27% more BTC, \u2461 +32% more BTC, \u2462 +5-15% per cycle.
          {shortsGtLongs ? " Context: shorts currently exceed longs (\u2463) — squeeze fuel, but only 3 months of data." : ""}
        </div>
      </div>

      {/* FOOTER */}
      <div style={{ fontSize: 10, color: C.muted, display: "flex", justifyContent: "space-between" }}>
        <span>Sources: StatMuse \u00b7 CoinMarketCap \u00b7 officialdata.org \u00b7 Glassnode \u00b7 CoinGlass</span>
        <span>ATH: $126,198 \u00b7 50wMA: $98K \u00b7 YTD: -27%</span>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Dashboard />);
  </script>
</body>
</html>
